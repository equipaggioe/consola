[project]
name = "consola-desktop"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "pillow>=13.0.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.14.4",
  "pyside6>=6.12.0",
]

[dependency-groups]
dev = [
  "deptry>=0.25.1",
  "pip-audit>=2.10.1",
  "pyrefly>=1.5.0",
  "pytest>=9.2.0",
  "pytest-qt>=4.5.0",
  "ruff>=0.17.6",
]
deploy = [
  "imageio>=2.38.2",
  "nuitka[onefile]>=4.3.5",
  "patchelf>=0.19.3.0; sys_platform == 'linux'",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-system"
required-version = "==0.13.10"

[tool.uv.build-backend]
module-name = "app"

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = [
  "ASYNC2", "B012", "B904", "D", "DTZ", "E401", "E402", "E501", "E711", "E712", "E713", "E714",
  "E721", "E731", "E741", "E742", "E743", "E902", "F", "G00", "I", "INP", "N801", "N802", "N803",
  "N804", "N805", "N806", "N807", "N815", "N816", "N999", "PGH004", "PT", "PTH", "PYI050",
  "PYI057", "PYI061", "RET501", "RET502", "RET503", "RUF006", "RUF036", "S306", "S323", "S324",
  "S501", "S503", "S602", "S605", "S612", "T20", "TID251", "TID252", "UP006", "UP007", "UP009",
  "UP013", "UP019", "UP031", "UP032", "UP035", "UP040", "UP045", "UP046", "W291", "W293", "W505",
  "W605",
]
ignore = ["D412", "D414", "PTH201", "PTH210"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__feature__".msg = "Qt API keeps its original names"
"http.client".msg = "HTTP goes through QNetworkAccessManager"
"httpx".msg = "HTTP goes through QNetworkAccessManager"
"PySide6.QtNetwork".msg = "HTTP goes in api/"
"PySide6.QtUiTools".msg = "The interface is built in code"
"requests".msg = "HTTP goes through QNetworkAccessManager"
"urllib.request".msg = "HTTP goes through QNetworkAccessManager"

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests"]
enabled-ignores = ["pyrefly"]

[tool.pyrefly.errors]
deprecated = "error"
unannotated-return = "error"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
strict = true
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.deptry]
known_first_party = ["app"]
